window:
  dimensions: 
    columns: 140
    lines: 38

  decorations: none
  startup_mode: Windowed
  opacity: 0.95

dynamic_title: true

cursor:
  style: Block
  unfocused_hollow: true

font:
  normal:
    family: "JetBrains Mono Nerd Font"
    style: "Regular"
  bold:
    family: "JetBrains Mono Nerd Font"
    style: "Bold"
  italic:
    family: "JetBrains Mono Nerd Font"
    style: "Italic"

import: [ "~/.config/alacritty/themes/themes/ayu_dark.yaml" ]

scrolling:
  history: 10000
  multiplier: 3

shell:
  program: tmux
