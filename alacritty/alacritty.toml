# dynamic_title = true
import = ["/home/aleksandr/.config/alacritty/themes/themes/ayu_dark.toml"]

[cursor]
style = "Block"
unfocused_hollow = true

[font.bold]
family = "JetBrains Mono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrains Mono Nerd Font"
style = "Italic"

[font.normal]
family = "JetBrains Mono Nerd Font"
style = "Regular"

[scrolling]
history = 10000
multiplier = 3

[shell]
program = "tmux"

[window]
decorations = "none"
opacity = 0.95
startup_mode = "Windowed"

[window.dimensions]
columns = 140
lines = 38
