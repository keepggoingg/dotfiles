# tmux config. Reload: prefix r.   Plugins: prefix I (install), prefix U (update).

# ---- Basics --------------------------------------------------------------------
set -g prefix C-Space
unbind C-b
bind C-Space send-prefix

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:usstyle:clipboard:focus:sync"
set -as terminal-features ",xterm-kitty:RGB:usstyle:clipboard:focus:sync"
set -g allow-passthrough on        # kitty graphics protocol (Ghostty and kitty): images from nvim, chafa
set -g set-clipboard on            # OSC 52: nvim and ssh copies reach the macOS clipboard
set -ga update-environment "KITTY_LISTEN_ON"
# Plugins and popups run with the server PATH; make sure Homebrew is on it.
set-environment -g PATH "/opt/homebrew/bin:/opt/homebrew/sbin:$HOME/.local/bin:$PATH"

set -g mouse on
set -s escape-time 10              # snappy Esc in nvim
set -g focus-events on             # nvim reloads changed files on focus
set -g history-limit 100000
set -g display-time 2000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g automatic-rename on
# Claude Code's process is named after its version (e.g. 2.1.329): show the chat title instead,
# minus the leading status glyph, cut to 20 chars.
setw -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{m/r:^[0-9]+[.][0-9]+[.][0-9]+$,#{pane_current_command}},#{=20:#{s/^[^ ]+ //:pane_title}},#{pane_current_command}}}#{?pane_dead,[dead],}'
set -g detach-on-destroy off       # closing a session switches to another instead of exiting
set -g status-keys emacs
setw -g mode-keys vi

# ---- Keys (prefix = Ctrl-Space) ------------------------------------------------
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"
bind e new-window -n tmux.conf "nvim ~/.config/tmux/tmux.conf"

# Projects: prefix f picks a repo and opens/switches to its session.
bind f display-popup -E -w 70% -h 60% "~/.local/bin/tmux-sessionizer"
bind s choose-tree -sZ -O name
bind S command-prompt -p "new session:" "new-session -A -s '%%' -c '#{pane_current_path}'"
bind BTab switch-client -l          # prefix Shift-Tab: last session
bind X confirm-before -p "kill session #S? (y/n)" kill-session

# Windows
bind c new-window -c "#{pane_current_path}"
bind Tab last-window
bind -r C-h previous-window
bind -r C-l next-window

# Panes (same keys as oh-my-tmux: - below, _ right; | also right)
bind - split-window -v -c "#{pane_current_path}"
bind _ split-window -h -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 4
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 4
bind + resize-pane -Z
bind > swap-pane -D
bind < swap-pane -U
bind g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit

# Alt-arrows jump words in the shell
bind -n M-Left  send-keys M-b
bind -n M-Right send-keys M-f

# Copy mode (vi): prefix Enter or scroll up; v select, C-v block, y copy
bind Enter copy-mode
bind p paste-buffer -p
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi Escape send -X cancel

# ---- Right-click menu ------------------------------------------------------------
# Apps that use the mouse (nvim, btop,  lazygit) and copy mode still get the
# right-click; everywhere else it opens this menu. Shift+right-click is Ghostty's
# own menu. Each item's letter is its shortcut while the menu is open.
bind -n MouseDown3Pane if -F -t= "#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}" \
  { select-pane -t= ; send -M } \
  { select-pane -t= ; display-menu -O -T "#[align=centre fg=#7aa2f7 bold] #{pane_current_command} " -x M -y M \
    "#{?mouse_word,  Copy \"#{=/24/…:mouse_word}\",}"  c { run -b "printf %s #{q:mouse_word} | pbcopy" ; display "copied" } \
    "#{?mouse_line,  Copy line,}"                       l { run -b "printf %s #{q:mouse_line} | pbcopy" ; display "line copied" } \
    "  Paste"                                           v { run "pbpaste | tmux load-buffer -" ; paste-buffer -p } \
    "  Scroll / select (copy mode)"                    [ { copy-mode } \
    "" \
    "  Split right"                                     | { split-window -h -c "#{pane_current_path}" } \
    "  Split below"                                     - { split-window -v -c "#{pane_current_path}" } \
    "#{?window_zoomed_flag,  Unzoom,  Zoom pane}"     z { resize-pane -Z } \
    "#{?#{>:#{window_panes},1},,-}  Swap with next pane" s { swap-pane -D } \
    "" \
    "  New window"                                      w { new-window -c "#{pane_current_path}" } \
    "  lazygit"                                         g { display-popup -E -w 90% -h 90% -d "#{pane_current_path}" lazygit } \
    "  Open project…"                                   p { display-popup -E -w 70% -h 60% "~/.local/bin/tmux-sessionizer" } \
    "  Sessions"                                        S { choose-tree -sZ -O name } \
    "" \
    "  Close pane"                                      x { confirm-before -p "close pane #{pane_index} (#{pane_current_command})? (y/n)" kill-pane } \
  }

# Tokyo Night menus (this one and the status-bar right-click menus)
set -g menu-style "bg=#1a1b26,fg=#c0caf5"
set -g menu-selected-style "bg=#283457,fg=#7aa2f7,bold"
set -g menu-border-style "fg=#7aa2f7"
set -g menu-border-lines rounded

# ---- Look: Tokyo Night ---------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=default,fg=#a9b1d6"
set -g status-left-length 40
set -g status-left "#[fg=#7aa2f7,bg=default]#[fg=#1a1b26,bg=#7aa2f7,bold]  #S#[fg=#7aa2f7,bg=default,nobold]  "
set -g status-right-length 80
set -g status-right "#{?client_prefix,#[fg=#e0af68]#[fg=#1a1b26 bg=#e0af68 bold]PREFIX#[fg=#e0af68 bg=default nobold] ,}#{?window_zoomed_flag,#[fg=#bb9af7]#[fg=#1a1b26 bg=#bb9af7 bold]ZOOM#[fg=#bb9af7 bg=default nobold] ,}#[fg=#292e42]#[fg=#a9b1d6,bg=#292e42]󰥔 %H:%M#[fg=#292e42,bg=default]"
setw -g window-status-format "#[fg=#565f89] #I #W "
setw -g window-status-current-format "#[fg=#292e42,bg=default]#[fg=#c0caf5,bg=#292e42,bold]#I #W#[fg=#292e42,bg=default,nobold]"
setw -g window-status-separator " "
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"
set -g pane-border-lines single
set -g message-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#283457"
set -g popup-border-style "fg=#7aa2f7"
set -g popup-border-lines rounded
set -g display-panes-active-colour "#7aa2f7"
set -g display-panes-colour "#565f89"
set -g clock-mode-colour "#7aa2f7"

# ---- Plugins (TPM; nothing updates on its own) -------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'   # Ctrl-h/j/k/l across tmux and nvim
set -g @plugin 'tmux-plugins/tmux-resurrect'      # prefix C-s save, prefix C-r restore
set -g @plugin 'tmux-plugins/tmux-continuum'      # autosave every 15 min, restore on start
set -g @continuum-restore 'on'
set -g @resurrect-capture-pane-contents 'on'

run '~/.config/tmux/plugins/tpm/tpm'
