# kitty is only the window: tmux handles tabs, splits and scrollback.
# Reload after edits: ctrl+cmd+,   Debug: kitty --debug-config

# ---- Startup -------------------------------------------------------------------
# Login shell first (PATH from .zprofile), then tmux: attach to the last-used
# session, or start the server (continuum restores) if none is running.
shell zsh --login -c "exec $HOME/.local/bin/tmux-attach-last"

# ---- Font ----------------------------------------------------------------------
font_family      family="JetBrainsMono Nerd Font"
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        14.0
# Ligatures off under the cursor so you can see what you are editing.
disable_ligatures cursor
modify_font cell_height 110%

# ---- Window ----------------------------------------------------------------------
# Keep the macOS title bar: traffic-light buttons to close/minimise the window.
hide_window_decorations no
window_padding_width 4 8
remember_window_size yes
confirm_os_window_close 0
enable_audio_bell no
background_opacity 0.90
background_blur 24

# ---- macOS -------------------------------------------------------------------------
# Option works as Alt: fzf Alt-C, word jumps, Neovim/tmux Alt bindings.
macos_option_as_alt yes
macos_quit_when_last_window_closed yes
macos_show_window_title_in none

# ---- Cursor ------------------------------------------------------------------------
cursor_trail 3
cursor_trail_decay 0.1 0.4
cursor_blink_interval 0

# ---- Mouse / URLs ----------------------------------------------------------------
url_style curly
mouse_hide_wait 2.0

# ---- Remote control (lets scripts and nvim talk to kitty) ------------------------
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# ---- Colors: Tokyo Night ---------------------------------------------------------
foreground #c0caf5
background #161621
selection_foreground none
selection_background #283457
cursor #c0caf5
cursor_text_color #1a1b26
url_color #7aa2f7

# black / red / green / yellow / blue / magenta / cyan / white
color0  #1d202f
color8  #414868
color1  #f7768e
color9  #f88b9f
color2  #9ece6a
color10 #afd784
color3  #e0af68
color11 #e3b878
color4  #7aa2f7
color12 #8baef8
color5  #bb9af7
color13 #ccb4f9
color6  #7dcfff
color14 #99daff
color7  #a9b1d6
color15 #c0caf5

# ---- Keys --------------------------------------------------------------------------
# No kitty tabs or kitty windows: tmux does that. Unbind so muscle memory goes to tmux.
tab_bar_style hidden
map cmd+t no_op
map cmd+w no_op
map cmd+enter no_op
map ctrl+tab no_op
map ctrl+shift+tab no_op
map shift+cmd+] no_op
map shift+cmd+[ no_op
map kitty_mod+t no_op
map kitty_mod+q no_op
map kitty_mod+enter no_op
map kitty_mod+alt+t no_op
map kitty_mod+right no_op
map kitty_mod+left no_op
map kitty_mod+. no_op
map kitty_mod+, no_op
map cmd+1 no_op
map cmd+2 no_op
map cmd+3 no_op
map cmd+4 no_op
map cmd+5 no_op
map cmd+6 no_op
map cmd+7 no_op
map cmd+8 no_op
map cmd+9 no_op

# Font size
map cmd+equal  change_font_size all +1.0
map cmd+minus  change_font_size all -1.0
map cmd+0      change_font_size all 0
