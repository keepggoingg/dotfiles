shell tmux

font_family      JetBrainsMono Nerd Font Mono Thin
italic_font      JetBrainsMono Nerd Font Mono Thin Italic
bold_font        auto
bold_italic_font auto
font_size 11.0

hide_window_decorations titlebar-only

url_color #7aa2f7
url_style curly

enable_audio_bell no

foreground #c0caf5
background #161621
background_opacity 0.75

# selection_foreground #000000
# selection_background #fffacd

color0 #1d202f
color8 #414868

#: black

color1 #f7768e
color9 #f88b9f

#: red

color2  #9ece6a
color10 #afd784

#: green

color3  #e0af68
 color11 #e3b878

#: yellow

color4  #7aa2f7
color12 #8baef8

#: blue

color5  #bb9af7
color13 #ccb4f9

#: magenta

color6  #7dcfff
color14 #99daff

#: cyan

color7  #a9b1d6
color15 #c0caf5

#: white

# mark1_foreground black

#: Color for marks of type 1

# mark1_background #98d3cb

#: Color for marks of type 1 (light steel blue)

# mark2_foreground black

#: Color for marks of type 2

# mark2_background #f2dcd3
#: Color for marks of type 1 (beige)

# mark3_foreground black

#: Color for marks of type 3

# mark3_background #f274bc

#: Color for marks of type 3 (violet)

confirm_os_window_close 0

allow_remote_control socket-only
listen_on unix:/tmp/kitty

cursor_trail 3
cursor_trail_decay 0.1 0.4

# No kitty tabs (tmux handles that): hide the tab bar and unbind every tab shortcut
tab_bar_style hidden
map cmd+t no_op
map ctrl+shift+t no_op
map kitty_mod+t no_op
map kitty_mod+alt+t no_op
map cmd+w no_op
map kitty_mod+q no_op
map ctrl+tab no_op
map ctrl+shift+tab no_op
map kitty_mod+right no_op
map kitty_mod+left no_op
map shift+cmd+] no_op
map shift+cmd+[ no_op
map kitty_mod+. no_op
map kitty_mod+, no_op
map cmd+1 no_op
map cmd+2 no_op
map cmd+3 no_op
map cmd+4 no_op
map cmd+5 no_op
map cmd+6 no_op
map cmd+7 no_op
map cmd+8 no_op
map cmd+9 no_op
